[metadata]
name = sherlockbench-client
version = 0.1

[options]
package_dir=
    =src
packages = find:
install_requires =
    alembic >= 1.15.2
    toolz >= 1.0.0
    openai >= 2.0.0
    requests >= 2.32.3
    PyYAML >= 6.0.2
    psycopg2-binary >= 2.9.10
    PyPika >= 0.48.9
    anthropic >= 1.4.0
    google-genai >= 1.16.1
    filelock >= 3.18.0

[options.extras_require]
dev = 
    pytest >= 8.3.5

[options.entry_points]
# Two-phase is the standard way to run sherlockbench.
#
# In three-phase mode it's context is summarized and reset in-between
# investigation and verification. Some models perform better with 3-phase mode.

console_scripts = 
    sbench_openai_2p     = sherlockbench_openai.main:two_phase
    sbench_openai_3p     = sherlockbench_openai.main:three_phase
    sbench_openai_inv_isolated = sherlockbench_openai.main:inv_isolated
    sbench_openai_random_inv = sherlockbench_openai.main:random_inv
    sbench_openai        = sherlockbench_openai.main:main

    sbench_oai_compat_2p = sherlockbench_oai_compat.main:two_phase
    sbench_oai_compat_3p = sherlockbench_oai_compat.main:three_phase
    sbench_oai_compat_inv_isolated = sherlockbench_oai_compat.main:inv_isolated
    sbench_oai_compat_random_inv = sherlockbench_oai_compat.main:random_inv
    sbench_oai_compat    = sherlockbench_oai_compat.main:main

    sbench_google_2p     = sherlockbench_google.main:two_phase
    sbench_google_3p     = sherlockbench_google.main:three_phase
    sbench_google_inv_isolated = sherlockbench_google.main:inv_isolated
    sbench_google_random_inv = sherlockbench_google.main:random_inv
    sbench_google        = sherlockbench_google.main:main

    sbench_anthropic_2p  = sherlockbench_anthropic.main:two_phase
    sbench_anthropic_3p  = sherlockbench_anthropic.main:three_phase
    sbench_anthropic_inv_isolated = sherlockbench_anthropic.main:inv_isolated
    sbench_anthropic_random_inv = sherlockbench_anthropic.main:random_inv
    sbench_anthropic     = sherlockbench_anthropic.main:main

    # helpful commands
    label                = sherlockbench_commands.label:main
    summarize_attempts   = sherlockbench_commands.summarize_attempts:main
    print_tool_calls     = sherlockbench_commands.print_tool_calls:main
    sbench_list          = sherlockbench_commands.list_problem_sets:main
